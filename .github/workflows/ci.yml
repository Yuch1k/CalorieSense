name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Сборка и unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn test
        run: mvn -B -ntp test
